background-image:url("data:image/svg+xml,%3csvgxmlns='http://www.w3.org/2000/svg'fill='none'viewBox='002020'%3e%3cpathstroke='%236b7280'stroke-linecap='round'stroke-linejoin='round'stroke-width='1.5'd='m68444-4'/%3e%3c/svg%3e");background-position:right 12px center;background-repeat:no-repeat;background-size:16px;padding-right:44px}select:hover{border-color:#9ca3af}select:focus{outline:0;border-color:var(--global-theme-color)}input[type="text"]{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:16px;background:white;color:#000;transition:all .2s ease;box-sizing:border-box}input[type="text"]:hover{border-color:#9ca3af}input[type="text"]:focus{outline:0;border-color:var(--global-theme-color)}input[type="text"]::placeholder{color:#9ca3af}.generate-btn{width:100%;padding:14px 24px;background:var(--chinese-button-color);color:white;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s ease;margin-top:8px;margin-bottom:20px}.generate-btn:hover{background:var(--chinese-button-hover-color);transform:translateY(-1px);box-shadow:0 4px 12px #b8b8b866}.generate-btn:active{transform:translateY(0);box-shadow:0 4px 12px #b8b8b866}.generate-btn:focus{outline:0;box-shadow:0 4px 12px #b8b8b866}.generate-btn.loading{background:#9ca3af;cursor:not-allowed;position:relative}.generate-btn.loading::after{content:'';position:absolute;width:16px;height:16px;margin:auto;border:2px solid transparent;border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;top:50%;left:50%;transform:translate(-50%,-50%)}.generate-btn.loading .btn-text{opacity:0}@keyframes spin{0%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(-50%,-50%) rotate(360deg)}}</style> <div class="form-group"> <label for="difficulty-select">Difficulty:</label> <select id="difficulty-select"> <option value="beginner">Beginner</option> <option value="beginner-intermediate">Beginner-Intermediate</option> <option value="intermediate">Intermediate</option> <option value="intermediate-advanced" selected>Intermediate-Advanced</option> <option value="advanced">Advanced</option> </select> </div> <div class="form-group"> <label for="subject-input">Subject (optional):</label> <input type="text" maxlength="60" id="subject-input" placeholder="e.g., food, traveling, cooking..."> </div> <p><button class="generate-btn" id="generate-btn"> <span class="btn-text">Generate Sentences</span> </button></p> <div id="output"></div> <script>
    async function generateSentence(difficulty = 'intermediate', subject = '') {
        try {
            console.log(`Generating ${difficulty} sentences about: ${subject || 'a computer-generated topic'}`);
            const response = await fetch('https://deepseek-backend-zeta.vercel.app/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    difficulty: difficulty,
                    subject: subject
                })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            console.log(`Data received from API: `, data);
            return data;
        } catch (error) {
            console.error(`Error generating ${difficulty} sentence:`, error);
            return { sentence: `Error: ${error.message}` };
        }
    }

    function getSelectedDifficulty() {
        const dropdown = document.getElementById("difficulty-select");
        return dropdown.value;
    }

    function getSubject() {
        const subjectInput = document.getElementById("subject-input");
        return subjectInput.value.trim();
    }

    // Add subtle form interactions
    document.querySelectorAll('input, select').forEach(element => {
        element.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.005)';
            this.parentElement.style.transition = 'transform 0.2s ease';
        });
        element.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    const button = document.getElementById("generate-btn");
    button.addEventListener("click", async () => {
        console.log('Generate button clicked!');
        button.classList.add('loading');
        button.disabled = true;
        
        const selectedDifficulty = getSelectedDifficulty();
        const subject = getSubject();
        
        console.log('Selected difficulty:', selectedDifficulty);
        console.log('Selected subject:', subject || 'none');
        
        // Show loading state
        const subjectDisplay = subject ? ` about "${subject}"` : '';
        // You can use <h3>Generated five sentences${subjectDisplay}:</h3> to describe what sentences are being generated
        document.getElementById("output").innerHTML = `
            <div style="background-color: var(--global-theme-color-light); padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--global-theme-color);">
                Loading... (this usually takes 20-30 seconds)
            </div>
        `;
        
        try {
            const data = await generateSentence(selectedDifficulty, subject);
            document.getElementById("output").innerHTML = `
                <div class="chinese-text" style="background-color: var(--global-theme-color-light); padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--global-theme-color); white-space: pre-wrap;">${data.sentence}</div>
            `;
            
        } catch (error) {
            console.error('Error in button handler:', error);
            document.getElementById("output").innerText = 'Error generating sentence';
        }
        button.classList.remove('loading');
        button.disabled = false;
    });

    // Also generate sentences when "Enter" is pressed in the subject input
    document.getElementById("subject-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            document.getElementById("generate-btn").click();
        }
    });
</script> </article> </div> </div> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/assets/js/copy_code.js?c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/assets/js/mathjax-setup.js?a5bb4e6a542c
